name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore (locked)
        run: dotnet restore FinXmlProcessor.sln --locked-mode

      - name: Format check
        run: dotnet format FinXmlProcessor.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build FinXmlProcessor.sln -c Release --no-restore

      - name: Test
        run: dotnet test FinXmlProcessor.sln -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults --collect:"XPlat Code Coverage"

      - name: Vulnerable package scan
        shell: bash
        run: |
          dotnet list FinXmlProcessor.sln package --vulnerable --include-transitive > vulnerable.txt || true
          cat vulnerable.txt
          if grep -qi "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable NuGet packages detected"; exit 1
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
          retention-days: 14
