name: Release (signed and notarized)

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  build-sign-notarize:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-arm64
            runner: macos-latest
          - rid: osx-x64
            runner: macos-15-intel
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Require signing secrets
        env:
          CERT: ${{ secrets.APPLE_DEVELOPER_ID_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
          KEY: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          for v in CERT CERT_PASSWORD TEAM KEY_ID ISSUER KEY; do
            if [ -z "${!v}" ]; then echo "::error::Missing required secret for $v (see docs/release.md)"; exit 1; fi
          done

      - name: Version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Import certificate into a temporary keychain
        env:
          CERT: ${{ secrets.APPLE_DEVELOPER_ID_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.+)".*/\1/')"
          [ -n "$IDENTITY" ] || { echo "::error::No Developer ID Application identity found"; exit 1; }
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Write App Store Connect API key
        env:
          KEY: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          echo "$KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Restore (locked), build and test
        run: |
          dotnet restore FinXmlProcessor.sln --locked-mode
          dotnet build FinXmlProcessor.sln -c Release --no-restore
          dotnet test FinXmlProcessor.sln -c Release --no-build

      - name: Build bundle
        run: |
          chmod +x scripts/macos/*.sh
          scripts/macos/build-app.sh ${{ matrix.rid }} artifacts ${{ steps.version.outputs.version }}

      - name: Sign, notarize and staple
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: scripts/macos/sign-and-notarize.sh "artifacts/${{ matrix.rid }}/FinXml Processor.app" "artifacts/${{ matrix.rid }}" ${{ steps.version.outputs.version }} ${{ matrix.rid }}

      - name: SBOM (CycloneDX)
        run: |
          dotnet tool install --global CycloneDX
          ~/.dotnet/tools/dotnet-CycloneDX FinXmlProcessor.sln -o artifacts/${{ matrix.rid }} -fn sbom-${{ matrix.rid }}.json -j

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.rid }}
          path: |
            artifacts/${{ matrix.rid }}/*.dmg
            artifacts/${{ matrix.rid }}/*.dmg.sha256
            artifacts/${{ matrix.rid }}/sbom-*.json
            artifacts/${{ matrix.rid }}/notarization-*.json

      - name: Clean up keychain and credentials
        if: always()
        run: |
          if [ -n "${KEYCHAIN:-}" ] && [ -f "$KEYCHAIN" ]; then security delete-keychain "$KEYCHAIN" || true; fi
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/cert.p12"

  publish:
    name: Publish GitHub release
    needs: build-sign-notarize
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true

      - name: Compose notes
        run: |
          {
            echo "## FinXml Processor ${GITHUB_REF_NAME}"
            echo
            echo "Signed and notarized macOS builds. Download the asset for your Mac:"
            echo
            echo "- Apple Silicon: \`FinXmlProcessor-${GITHUB_REF_NAME#v}-osx-arm64.dmg\`"
            echo "- Intel: \`FinXmlProcessor-${GITHUB_REF_NAME#v}-osx-x64.dmg\`"
            echo
            echo "Verify a download: \`shasum -a 256 -c <asset>.sha256\`"
            echo
            echo "### Checksums"
            echo '```'
            cat release-assets/*.sha256
            echo '```'
          } > notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "FinXml Processor $GITHUB_REF_NAME" --notes-file notes.md --verify-tag release-assets/*.dmg release-assets/*.sha256 release-assets/sbom-*.json
